# LAB 3.3 - StatefulSet con Headless Service y un PVC por replica.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: c3-sts
  labels:
    app: nginx
spec:
  clusterIP: None          # HEADLESS: sin VIP, el DNS devuelve las IP de los Pods
  selector:
    app: nginx
  ports:
    - name: web
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: c3-sts
spec:
  serviceName: nginx       # debe coincidir con el Headless Service
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: nginx
          image: registry.k8s.io/nginx-slim:0.27
          ports:
            - containerPort: 80
              name: web
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:     # crea www-web-0, www-web-1, www-web-2
    - metadata:
        name: www
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
