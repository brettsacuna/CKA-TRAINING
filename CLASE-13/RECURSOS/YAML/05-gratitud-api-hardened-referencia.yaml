# LAB 13.3 - REFERENCIA: api conforme al Pod Security Standard 'restricted',
# con la raiz de solo lectura y emptyDir para lo escribible.
apiVersion: v1
kind: Namespace
metadata:
  name: gratitud-api
  labels:
    part-of: gratitud
    tier: api
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: gratitud-api, labels: {app: gratitud-api, part-of: gratitud}}
spec:
  replicas: 2
  selector: {matchLabels: {app: gratitud-api}}
  template:
    metadata: {labels: {app: gratitud-api, part-of: gratitud}}
    spec:
      securityContext:                       # nivel de Pod
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{containerPort: 8080}]
          securityContext:                   # nivel de contenedor (gana este)
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: gratitud-api}
spec: {selector: {app: gratitud-api}, ports: [{port: 80, targetPort: 8080}]}
