# LAB 1.4 - Estado CORRECTO de referencia del challenge.
# Material del instructor: no lo entregues antes de resolver el laboratorio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: c1-challenge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shop-web
  template:
    metadata:
      labels:
        app: shop-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop-svc
  namespace: c1-challenge
spec:
  type: NodePort
  selector:
    app: shop-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 31200
