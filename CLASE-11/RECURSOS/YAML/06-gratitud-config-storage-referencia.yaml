# REFERENCIA COMPLETA de la Sesion 11.
# Configuracion externalizada de la API + almacenamiento persistente de la capa
# de datos de GRATITUD. Usalo para comprobar, no para copiar sin entender.
#
# Antes: si vas a usar el PV estatico, crea el directorio en el nodo:
#   mkdir -p /mnt/gratitud-uploads
apiVersion: v1
kind: Namespace
metadata: {name: gratitud-api, labels: {part-of: gratitud, tier: api}}
---
apiVersion: v1
kind: Namespace
metadata: {name: gratitud-datos, labels: {part-of: gratitud, tier: datos}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: gratitud-config, namespace: gratitud-api}
data:
  LOG_LEVEL: info
  FEATURE_GRATITUD_V2: "true"
  UPSTREAM_CACHE: http://cache.gratitud-datos
  app.conf: |
    [gratitud]
    log_level = info
    workers = 4
    upstream_cache = http://cache.gratitud-datos
    partner_api = https://partners.example.com/v2
---
apiVersion: v1
kind: Secret
metadata: {name: gratitud-db, namespace: gratitud-api}
type: Opaque
stringData: {DB_USER: gratitud, DB_PASSWORD: r3f-c4mbi4-esto, DB_HOST: db.corp.example.com}
---
apiVersion: v1
kind: Secret
metadata: {name: gratitud-api-tokens, namespace: gratitud-api}
type: Opaque
stringData: {PARTNER_TOKEN: pt_live_9f2c1a7b4e, WEBHOOK_SIGNING_KEY: whsk_3d8e0f5a19}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: gratitud-api, labels: {app: gratitud-api, part-of: gratitud}}
spec:
  replicas: 1
  selector: {matchLabels: {app: gratitud-api}}
  template:
    metadata: {labels: {app: gratitud-api, part-of: gratitud}}
    spec:
      containers:
        - name: api
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: gratitud-config}
            - secretRef: {name: gratitud-db}
          env:
            - name: PARTNER_TOKEN
              valueFrom:
                secretKeyRef: {name: gratitud-api-tokens, key: PARTNER_TOKEN}
          volumeMounts:
            - {name: cfg, mountPath: /etc/gratitud/app.conf, subPath: app.conf}
      volumes:
        - name: cfg
          configMap:
            name: gratitud-config
            items: [{key: app.conf, path: app.conf}]
---
# --- almacenamiento: PV estatico de reserva + PVC + Deployment ---
apiVersion: v1
kind: PersistentVolume
metadata: {name: gratitud-pv-uploads, labels: {app: gratitud, uso: uploads}}
spec:
  storageClassName: manual
  capacity: {storage: 1Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  hostPath: {path: /mnt/gratitud-uploads, type: DirectoryOrCreate}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: gratitud-uploads, namespace: gratitud-datos}
spec:
  storageClassName: manual
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: datos, namespace: gratitud-datos, labels: {app: gratitud-datos, part-of: gratitud}}
spec:
  replicas: 1
  selector: {matchLabels: {app: gratitud-datos}}
  template:
    metadata: {labels: {app: gratitud-datos, part-of: gratitud}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          volumeMounts: [{name: data, mountPath: /data/uploads}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: gratitud-uploads}
