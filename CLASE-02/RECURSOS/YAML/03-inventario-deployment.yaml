# LAB 2.1 / 2.2 - Aplicacion testigo que debe sobrevivir al drain y al upgrade.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario
  namespace: c2-basico
spec:
  replicas: 4
  selector:
    matchLabels:
      app: inventario
  template:
    metadata:
      labels:
        app: inventario
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 3
