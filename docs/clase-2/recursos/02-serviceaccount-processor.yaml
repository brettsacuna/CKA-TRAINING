# LAB 2.4 - ServiceAccount processor (estado correcto de referencia).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: processor
  namespace: project-hamster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: processor
  namespace: project-hamster
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: processor
  namespace: project-hamster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: processor
subjects:
  - kind: ServiceAccount
    name: processor
    namespace: project-hamster
