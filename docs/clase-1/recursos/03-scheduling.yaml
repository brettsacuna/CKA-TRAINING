# LAB 1.3 - Fragmentos de referencia de scheduling.
# NO es la solución completa del laboratorio: son los patrones sintácticos.
apiVersion: v1
kind: Pod
metadata:
  name: prod-app
  namespace: c1-avanzado
spec:
  nodeSelector:
    environment: production
  containers:
    - name: nginx
      image: nginx:1.27-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: data-job
  namespace: c1-avanzado
spec:
  tolerations:
    - key: team
      operator: Equal
      value: data
      effect: NoSchedule
  nodeSelector:
    environment: data
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: affinity-app
  namespace: c1-avanzado
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: environment
                operator: In
                values: ["production", "staging"]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 60
          preference:
            matchExpressions:
              - key: disktype
                operator: In
                values: ["ssd"]
  containers:
    - name: nginx
      image: nginx:1.27-alpine
