# LAB 5.2 (referencia) - El mismo routing expresado con Gateway API.
# Requiere las CRD de Gateway API y un controlador que las implemente.
#   kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
#
# Separacion de responsabilidades:
#   GatewayClass -> proveedor de infraestructura
#   Gateway      -> administrador de plataforma
#   HTTPRoute    -> equipo de aplicacion
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: portal-gateway
  namespace: c5-ingress
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal-routes
  namespace: c5-ingress
spec:
  parentRefs:
    - name: portal-gateway
  rules:
    - matches:
        - path: {type: PathPrefix, value: /service1}
      backendRefs:
        - name: service1
          port: 80
    - matches:
        - path: {type: PathPrefix, value: /service2}
      backendRefs:
        - name: service2
          port: 80
