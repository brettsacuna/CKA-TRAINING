# LAB 6.5 - Arquitectura de referencia del INTEGRADOR FINAL.
# MATERIAL DEL INSTRUCTOR: no entregar antes de la Fase 1.
apiVersion: v1
kind: Namespace
metadata: {name: tienda}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: tienda}
data:
  APP_ENV: production
  BACKEND_URL: http://backend.tienda.svc.cluster.local
---
apiVersion: v1
kind: Secret
metadata: {name: db-credentials, namespace: tienda}
type: Opaque
stringData:
  username: appuser
  password: T13nd4-2026
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: tienda, labels: {app: db}}
spec:
  clusterIP: None
  selector: {app: db}
  ports: [{name: pg, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: tienda}
spec:
  serviceName: db
  replicas: 3
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app: db}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432, name: pg}]
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: db-credentials, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: db-credentials, key: password}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits:   {cpu: "500m", memory: "512Mi"}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: tienda}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      volumes:
        - name: cred
          secret: {secretName: db-credentials}
      containers:
        - name: backend
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          envFrom: [{configMapRef: {name: app-config}}]
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: db-credentials, key: password}}
          volumeMounts: [{name: cred, mountPath: /etc/db-credentials, readOnly: true}]
          resources:
            requests: {cpu: "100m", memory: "64Mi"}
            limits:   {cpu: "300m", memory: "256Mi"}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: tienda}
spec:
  selector: {app: backend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: tienda}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          envFrom: [{configMapRef: {name: app-config}}]
          resources:
            requests: {cpu: "100m", memory: "64Mi"}
            limits:   {cpu: "300m", memory: "256Mi"}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: tienda}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: tienda, namespace: tienda}
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["tienda.local"]
      secretName: tienda-tls
  rules:
    - host: tienda.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: backend, port: {number: 80}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 80}}}
