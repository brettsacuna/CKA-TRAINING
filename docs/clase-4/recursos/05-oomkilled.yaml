# LAB 4.3 - Pod que supera su limite de memoria: termina OOMKilled (exit 137).
apiVersion: v1
kind: Pod
metadata: {name: memoria, namespace: c4-recursos}
spec:
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
      resources:
        requests: {memory: "50Mi"}
        limits:   {memory: "100Mi"}
