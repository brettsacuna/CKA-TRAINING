# LAB 3.3 - Solo si tu cluster NO tiene StorageClass por defecto.
# Un PV por replica. Crea los directorios en el/los worker(s) antes de aplicar.
apiVersion: v1
kind: PersistentVolume
metadata: {name: pv-sts-0}
spec:
  capacity: {storage: 1Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath: {path: /mnt/sts-0}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: pv-sts-1}
spec:
  capacity: {storage: 1Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath: {path: /mnt/sts-1}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: pv-sts-2}
spec:
  capacity: {storage: 1Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath: {path: /mnt/sts-2}
