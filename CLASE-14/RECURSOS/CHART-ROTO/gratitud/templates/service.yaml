apiVersion: v1
kind: Service
metadata:
  name: {{ include "gratitud.fullname" . }}
  labels:
    {{- include "gratitud.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gratitud.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
