{{- range $tier, $cfg := .Values.tiers }}
{{- $persist := eq $tier "cache" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $tier }}
  labels:
    {{- include "gratitud.labels" $ | nindent 4 }}
    tier: {{ $tier }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      tier: {{ $tier }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        part-of: gratitud
        tier: {{ $tier }}
      {{- if $.Values.prometheus.scrape }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $.Values.image.containerPort | quote }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        {{- include "gratitud.container" (dict "root" $ "name" $tier "persist" $persist) | nindent 8 }}
      volumes:
        {{- include "gratitud.volumes" (dict "root" $ "persist" $persist) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $tier }}
  labels:
    {{- include "gratitud.labels" $ | nindent 4 }}
    tier: {{ $tier }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    tier: {{ $tier }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: {{ $.Values.image.containerPort }}
      protocol: TCP
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.externalDatabase.name }}
  labels:
    {{- include "gratitud.labels" . | nindent 4 }}
    tier: datos
spec:
  type: ExternalName
  externalName: {{ .Values.externalDatabase.host }}
