# LAB 12.2 - Cuatro Deployments rotos, uno por sintoma.
apiVersion: v1
kind: Namespace
metadata: {name: c12-diag}
---
# ImagePullBackOff: el tag no existe ('alpime' en vez de 'alpine').
apiVersion: apps/v1
kind: Deployment
metadata: {name: p-image, namespace: c12-diag, labels: {app: p-image}}
spec:
  replicas: 1
  selector: {matchLabels: {app: p-image}}
  template:
    metadata: {labels: {app: p-image}}
    spec:
      containers:
        - {name: c, image: "nginx:1.27-alpime"}
---
# CrashLoopBackOff: el proceso principal sale con codigo != 0.
apiVersion: apps/v1
kind: Deployment
metadata: {name: p-crash, namespace: c12-diag, labels: {app: p-crash}}
spec:
  replicas: 1
  selector: {matchLabels: {app: p-crash}}
  template:
    metadata: {labels: {app: p-crash}}
    spec:
      containers:
        - name: c
          image: busybox:1.36
          command: ["sh", "-c", "echo 'arrancando p-crash'; sleep 3; echo 'ERROR: config no encontrada'; exit 1"]
---
# OOMKilled: limits.memory por debajo de lo que nginx necesita para arrancar.
apiVersion: apps/v1
kind: Deployment
metadata: {name: p-oom, namespace: c12-diag, labels: {app: p-oom}}
spec:
  replicas: 1
  selector: {matchLabels: {app: p-oom}}
  template:
    metadata: {labels: {app: p-oom}}
    spec:
      containers:
        - name: c
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {memory: 8Mi, cpu: 10m}
            limits: {memory: 8Mi}
---
# Pending: pide 40 CPU, que ningun nodo puede satisfacer.
apiVersion: apps/v1
kind: Deployment
metadata: {name: p-pending, namespace: c12-diag, labels: {app: p-pending}}
spec:
  replicas: 1
  selector: {matchLabels: {app: p-pending}}
  template:
    metadata: {labels: {app: p-pending}}
    spec:
      containers:
        - name: c
          image: nginx:1.27-alpine
          resources:
            requests: {cpu: "40"}
