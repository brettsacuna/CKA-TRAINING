# REFERENCIA COMPLETA de la Sesion 12.
# api y portal de GRATITUD con las tres sondas, requests/limits y anotaciones
# de descubrimiento para Prometheus. Usalo para comprobar, no para copiar sin entender.
#
# Nota: nginx:alpine no expone /healthz ni /ready ni /metrics reales; aqui se
# apunta a '/' para que las sondas pasen. En una app real, healthz != ready.
apiVersion: v1
kind: Namespace
metadata: {name: gratitud-api, labels: {part-of: gratitud, tier: api}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: gratitud-api, labels: {app: gratitud-api, part-of: gratitud}}
spec:
  replicas: 2
  selector: {matchLabels: {app: gratitud-api}}
  template:
    metadata: {labels: {app: gratitud-api, part-of: gratitud}}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          startupProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
            failureThreshold: 15        # 75 s de margen de arranque
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: gratitud-api
  labels: {part-of: gratitud}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: /metrics
spec:
  selector: {app: gratitud-api}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: portal, namespace: gratitud-api, labels: {app: gratitud-portal, part-of: gratitud}}
spec:
  replicas: 2
  selector: {matchLabels: {app: gratitud-portal}}
  template:
    metadata: {labels: {app: gratitud-portal, part-of: gratitud}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          startupProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: gratitud-api
  labels: {part-of: gratitud}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
spec:
  selector: {app: gratitud-portal}
  ports: [{port: 80, targetPort: 80}]
