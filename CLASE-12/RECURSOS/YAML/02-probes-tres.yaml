# LAB 12.1 - Referencia: la misma app con las tres sondas bien configuradas.
#   startupProbe  -> hasta 45 s de margen de arranque (9 x 5 s)
#   livenessProbe -> solo actua cuando startup ha pasado; reinicia si el proceso se cuelga
#   readinessProbe-> controla el trafico; si falla, el Pod sale del EndpointSlice
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: c12-basico
  labels: {app: web}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          startupProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
            failureThreshold: 9
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: c12-basico}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
