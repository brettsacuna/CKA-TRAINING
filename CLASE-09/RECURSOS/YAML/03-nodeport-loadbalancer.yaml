# LAB 9.2 - El mismo Deployment publicado con los tres tipos de Service.
# Los tres tienen el mismo selector: comparten EndpointSlice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda
  namespace: c9-publicar
  labels: {app: tienda, version: v1}
spec:
  replicas: 2
  selector: {matchLabels: {app: tienda, version: v1}}
  template:
    metadata: {labels: {app: tienda, version: v1}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
# ClusterIP: solo dentro del cluster. Para otros servicios internos.
apiVersion: v1
kind: Service
metadata: {name: tienda-ci, namespace: c9-publicar}
spec:
  type: ClusterIP
  selector: {app: tienda}
  ports: [{port: 80, targetPort: 80}]
---
# NodePort: el mismo puerto 31700 abierto en todos los nodos.
apiVersion: v1
kind: Service
metadata: {name: tienda-np, namespace: c9-publicar}
spec:
  type: NodePort
  selector: {app: tienda}
  ports: [{port: 80, targetPort: 80, nodePort: 31700}]
---
# LoadBalancer: pedira una IP externa al proveedor de nube.
# Sin integracion de nube (MetalLB, cloud-controller-manager) se queda <pending>,
# pero el ClusterIP y el NodePort subyacentes SI funcionan.
apiVersion: v1
kind: Service
metadata: {name: tienda-lb, namespace: c9-publicar}
spec:
  type: LoadBalancer
  selector: {app: tienda}
  ports: [{port: 80, targetPort: 80}]
