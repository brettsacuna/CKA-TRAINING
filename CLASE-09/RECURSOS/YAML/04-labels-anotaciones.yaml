# LAB 9.2 - Partes C y D.
#
# 1) Un Service con anotaciones tipicas de LoadBalancer y de observabilidad.
#    Las anotaciones NO seleccionan Pods: solo las lee un controlador concreto
#    (el del balanceador de la nube, el de metricas...) o una persona.
#    Estas claves 'service.beta.kubernetes.io/aws-...' solo las entiende el
#    cloud-controller-manager de AWS: NO son portables a GCP, Azure ni on-prem.
apiVersion: v1
kind: Service
metadata:
  name: tienda-web
  namespace: c9-publicar
  labels:
    app: tienda
  annotations:
    gratitud.io/owner: equipo-tienda
    gratitud.io/runbook: https://wiki.gratitud.internal/tienda
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector: {app: tienda}          # esto SI engancha
  ports: [{port: 80, targetPort: 80}]
---
# 2) Una segunda version de la aplicacion. Comparte la label app=tienda, asi que
#    un Service con selector {app: tienda} tambien la enruta. Para servir solo v1
#    hay que acotar el selector a {app: tienda, version: v1}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-v2
  namespace: c9-publicar
  labels: {app: tienda, version: v2}
spec:
  replicas: 2
  selector: {matchLabels: {app: tienda, version: v2}}
  template:
    metadata: {labels: {app: tienda, version: v2}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
